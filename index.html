<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misbah Khadim - Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f8f9fa;
    }
    .banner {
      width: 100%;
      height: 450px;
      background: url('work.jpg') no-repeat center center;
      background-size: cover;
    }
    .content {
      text-align: center;
      padding: 40px 20px;
      background: white;
      margin: -50px auto 0;
      max-width: 800px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #2c3e50;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }
  </style>
</head>
<body>

  <div class="banner"></div>

  <div class="content">
    <h1>Hi, I'm Misbah Khadim</h1>
    <p>Welcome to my portfolio website. This is my professional work showcase.</p>
    <p>Thank you for visiting!</p>
    <a href="#" class="btn">Contact Me</a>

</body>
</html>
